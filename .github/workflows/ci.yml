name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  # Daily, so a new Swift release (swift:latest) that breaks the build shows up without a push.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  # Scheduled runs get their own group, so they neither cancel nor get cancelled by pushes to main.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  test:
    name: Test (Linux arm64, Swift ${{ matrix.swift }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # 6.4 is the tested setup in the README; latest is the newest Swift release.
        swift: ['6.4', 'latest']
    # The official image is only used for the Swift toolchain. Everything runs directly in it.
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python (for the contract harness and the SDK lookup) and the Static Linux SDK
        run: |
          apt-get update -qq && apt-get install -y -qq python3 ca-certificates > /dev/null
          swift --version
          ./scripts/install-static-sdk.sh

      - name: Unit tests
        run: swift test

      - name: Plugin logic (vercel.json edits, .swift-version, toolchain check)
        run: ./scripts/test-plugin.sh

      - name: Build the examples with the vercel plugin and run the runtime contract tests
        # The binaries are fully static, so they run directly on this Linux host.
        run: ./scripts/test-linux.sh
